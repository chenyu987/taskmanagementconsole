name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: 翻译文件已随代码更新（中英双语）
        run: npm run i18n:check
      - name: Test（含 cxuq 隔离测试）
        run: npm test
      - name: Build
        run: npx vite build
